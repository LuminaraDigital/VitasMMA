<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Your Health and Fitness MMA App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        background-color: #0B0F19;
        margin: 0;
        padding: 0;
        color: white;
        font-family: sans-serif;
      }
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
    </style>
    <script>
      console.log('VitasMMA: index.html initializing...');
      
      // Capture script load errors
      window.addEventListener('error', function(e) {
        if (e.target.tagName === 'SCRIPT') {
          console.error('VitasMMA: Script load error for ' + e.target.src);
          
          // Try to reload with a cache buster if it's the main script
          if (e.target.src.includes('main.tsx') && !window.__vitas_retried) {
            window.__vitas_retried = true;
            console.log('VitasMMA: Retrying script load with cache buster...');
            var newScript = document.createElement('script');
            newScript.type = 'module';
            newScript.src = '/src/main.tsx?v=' + Date.now();
            document.body.appendChild(newScript);
            return;
          }

          var root = document.getElementById('root');
          if (root) {
            var errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'margin-top: 20px; padding: 15px; background: rgba(255,0,0,0.1); border: 1px solid rgba(255,0,0,0.2); border-radius: 8px; color: #FF5F5F; font-size: 13px; max-width: 300px;';
            errorDiv.innerHTML = '<strong>Network Error:</strong> Failed to load ' + e.target.src.split('/').pop() + '. <br/><br/>' +
              'This often happens in the AI Studio preview due to cookie restrictions. <br/><br/>' +
              '<button onclick="window.open(window.location.href, \'_blank\')" style="margin-right:10px; padding: 8px 16px; background: #00F5A0; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Open in New Tab</button>' +
              '<button onclick="window.location.reload()" style="padding: 8px 16px; background: white; color: black; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Retry</button>';
            root.appendChild(errorDiv);
          }
        }
      }, true);

      window.onerror = function(msg, url, line, col, error) {
        console.error('VitasMMA: Global error caught in index.html:', msg, error);
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 40px; color: white; background: #0B0F19; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: sans-serif;">' +
            '<h1 style="font-size: 32px; margin-bottom: 20px; color: #FF2A2A; font-weight: 900; text-transform: uppercase; font-style: italic;">Critical Error</h1>' +
            '<div style="background: rgba(255,0,0,0.1); border: 1px solid rgba(255,0,0,0.2); padding: 20px; border-radius: 12px; margin-bottom: 30px; text-align: left; width: 100%; max-width: 600px; overflow: auto; font-family: monospace; font-size: 12px;">' +
            '<p style="color: #FF5F5F; font-weight: bold; margin-bottom: 10px;">' + msg + '</p>' +
            '<pre style="color: #94a3b8; white-space: pre-wrap; word-break: break-all;">' + (error && error.stack ? error.stack : 'URL: ' + url + '\nLine: ' + line + '\nCol: ' + col) + '</pre>' +
            '</div>' +
            '<div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">' +
            '<button onclick="window.location.reload()" style="padding: 14px 28px; background: white; color: black; border-radius: 9999px; font-weight: bold; border: none; cursor: pointer; font-size: 16px;">Reload App</button>' +
            '<button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="padding: 14px 28px; background: rgba(255,255,255,0.1); color: white; border-radius: 9999px; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-size: 16px;">Clear Cache</button>' +
            '</div>' +
            '</div>';
        }
        return false;
      };
      window.onunhandledrejection = function(event) {
        console.error('VitasMMA: Unhandled promise rejection in index.html:', event.reason);
      };
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #94a3b8;">
        <div style="width: 40px; height: 40px; border: 3px solid rgba(0, 245, 160, 0.1); border-top-color: #00F5A0; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;"></div>
        <p style="font-size: 14px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase;">Initializing VitasMMA...</p>
      </div>
    </div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
